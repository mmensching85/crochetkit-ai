<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - CrochetKit AI</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" type="image/webp" href="/assets/favicon.webp">
</head>
<body>
    <header>
        <div class="container">
            <h1><a href="/">CrochetKit AI</a></h1>
            <nav>
                <a href="/">Home</a>
                <a href="/stash.html">My Stash</a>
                <a href="/about.html">About</a>
                <a href="/contact.html" class="active">Contact</a>
                <a href="/privacy.html">Privacy</a>
                <a href="/glossary.html">Glossary</a>
                <a href="/admin.html">Admin</a>
                <a href="/auth.html" id="authLink">Login / Register</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section id="contactFormSection" class="card">
            <h2>Contact Us</h2>
            <p>Have a question, feedback, or just want to say hello? Fill out the form below, and we'll get back to you as soon as possible!</p>
            
            <form id="contactForm">
                <div class="form-group">
                    <label for="name">Your Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Your Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="message">Your Message:</label>
                    <textarea id="message" name="message" rows="6" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Send Message</button>
            </form>
            
            <div id="formMessage" style="margin-top: 20px; text-align: center;"></div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 CrochetKit AI. All rights reserved.</p>
        </div>
    </footer>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const contactForm = document.getElementById('contactForm');
            const formMessage = document.getElementById('formMessage');

            contactForm.addEventListener('submit', async function(event) {
                event.preventDefault();
                formMessage.innerHTML = ''; // Clear previous messages
                formMessage.style.color = '';

                const formData = new FormData(contactForm);
                const data = Object.fromEntries(formData.entries());

                try {
                    const response = await fetch('/api/contact', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(data)
                    });

                    const result = await response.json();

                    if (response.ok) {
                        formMessage.style.color = 'green';
                        formMessage.innerHTML = 'Thank you for your message! We will get back to you soon.';
                        contactForm.reset();
                    } else {
                        formMessage.style.color = 'red';
                        formMessage.innerHTML = result.error || 'An error occurred while sending your message.';
                    }
                } catch (error) {
                    console.error('Error submitting contact form:', error);
                    formMessage.style.color = 'red';
                    formMessage.innerHTML = 'An unexpected error occurred. Please try again later.';
                }
            });
        });
    </script>
</body>
</html>
