<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — CrochetKit AI</title><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<header class="app-header"><div class="header-row"><div><h1>👤 Profile</h1><p id="profileName">Maker</p></div>
<div class="header-extra-nav"><a href="/" class="btn btn-outline btn-sm">← Back</a></div></div></header>
<div id="profileContent"><p style="text-align:center;padding:40px;color:#888;">Loading...</p></div>
</div>
<script>
function escHtml(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#x27;'); }

async function loadProfile() {
  var params = new URLSearchParams(window.location.search);
  var username = params.get('user') || 'Anonymous';
  document.getElementById('profileName').textContent = username + "'s Projects";

  var el = document.getElementById('profileContent');
  try {
    var resp = await fetch('/api/share-project');
    var all = await resp.json();
    var projects = all.filter(function(p) { return (p.username || 'Anonymous') === username; });

    if (projects.length === 0) {
      el.innerHTML = '<div class="card" style="text-align:center;padding:40px;"><h3>No projects yet</h3><p style="color:#888;">' + escHtml(username) + ' hasn\'t shared any projects.</p></div>';
      return;
    }

    // Get follower count
    var fc = await fetch('/api/follow?type=followers&user=' + encodeURIComponent(username));
    var followers = await fc.json();
    var followerCount = Array.isArray(followers) ? followers.length : 0;

    var html = '<div class="card" style="margin-bottom:16px;"><p><strong>' + projects.length + '</strong> projects shared · <strong>' + followerCount + '</strong> followers</p></div>';
    html += '<div class="project-cards">';
    projects.forEach(function(p) {
      html += '<div class="project-card">';
      html += '<div class="card-hero">' + (p.photo_url ? '<img src="' + escHtml(p.photo_url) + '" alt="' + escHtml(p.pattern_name) + '" class="card-hero-img" loading="lazy">' : '<div style="height:120px;background:#e8d8ff;display:flex;align-items:center;justify-content:center;font-size:32px;">🧶</div>') + '</div>';
      html += '<h3>' + escHtml(p.pattern_name) + '</h3>';
      if (p.notes) html += '<p class="card-desc">' + escHtml(p.notes) + '</p>';
      html += '<p style="font-size:12px;color:#888;">' + new Date(p.created_at).toLocaleDateString() + '</p>';
      html += '</div>';
    });
    html += '</div>';
    el.innerHTML = html;
  } catch(e) {
    el.innerHTML = '<div class="card"><p style="color:#e74c3c;">Error loading profile.</p></div>';
  }
}
loadProfile();
</script>
</body>
</html>
